<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRECRIME_ARCHIVE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Minority Report - Atmospheric breathing effect */
    @keyframes atmospheric-pulse {

      0%,
      100% {
        filter: brightness(1) contrast(1.1);
        transform: scale(1);
      }

      50% {
        filter: brightness(1.05) contrast(1.05);
        transform: scale(1.002);
      }
    }

    /* Gentle bloom pulse on header */
    header {
      animation: atmospheric-pulse 8s ease-in-out infinite;
    }

    /* Halation effect on title */
    .halation {
      position: relative;
      display: inline-block;
    }

    .halation::before {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      filter: blur(20px);
      opacity: 0.6;
      z-index: -1;
      color: #c8e5f5;
    }

    /* Subtle floating animation */
    @keyframes float-drift {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    main {
      animation: float-drift 6s ease-in-out infinite;
    }

    /* Light particles */
    .light-particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: rgba(120, 200, 255, 0.6);
      border-radius: 50%;
      filter: blur(1px);
      box-shadow: 0 0 10px rgba(120, 200, 255, 0.8);
      pointer-events: none;
      z-index: 2;
      animation: particle-float 15s linear infinite;
    }

    @keyframes particle-float {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        transform: translateY(-10vh) translateX(100px);
        opacity: 0;
      }
    }

    .light-particle:nth-child(2) {
      left: 30%;
      animation-delay: -5s;
      animation-duration: 12s;
    }

    .light-particle:nth-child(3) {
      left: 60%;
      animation-delay: -8s;
      animation-duration: 18s;
    }

    .light-particle:nth-child(4) {
      left: 80%;
      animation-delay: -3s;
      animation-duration: 14s;
    }
  </style>
</head>

<body>
  <!-- Atmospheric particles -->
  <div class="light-particle"></div>
  <div class="light-particle"></div>
  <div class="light-particle"></div>
  <div class="light-particle"></div>

  <header>
    <h1 class="halation" data-text="PRECRIME_ARCHIVE">PRECRIME_ARCHIVE</h1>
    <nav>
      <a href="index.html">DATA_CORE</a>
      <a href="images.html">VISUALS</a>
      <a href="music.html">AUDIO_LOGS</a>
      <a href="socials.html">NETWORK</a>
      <a href="guestbook.html">WITNESS_LOG</a>
    </nav>
  </header>
  <main>
    <h2>SYSTEM_ONLINE</h2>
    <p>Welcome to the <b>PRECRIME_ARCHIVE</b>. Accessing authorized personnel records...<br>
      Browse the visual database, listen to recovered audio logs, or establish a network connection.</p>
  </main>
</body>

</html>
