<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <style>
    /* Minority Report - Enhanced atmospheric effects */
    @keyframes atmospheric-pulse {
      0%, 100% {
        filter: brightness(1) contrast(1.1);
        transform: scale(1);
      }
      50% {
        filter: brightness(1.08) contrast(1.08);
        transform: scale(1.003);
      }
    }

    header {
      animation: atmospheric-pulse 8s ease-in-out infinite;
    }

    .halation {
      position: relative;
      display: inline-block;
    }

    .halation::before {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      filter: blur(25px);
      opacity: 0.8;
      z-index: -1;
      color: #c8e5f5;
      animation: halation-pulse 4s ease-in-out infinite;
    }

    .halation:hover::before {
      filter: blur(20px) drop-shadow(3px 0 0 #ff00ff) drop-shadow(-3px 0 0 #00ffff);
    }

    @keyframes halation-pulse {
      0%, 100% { opacity: 0.8; filter: blur(25px); }
      50% { opacity: 1; filter: blur(30px); }
    }

    @keyframes float-drift {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    main {
      animation: float-drift 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .light-particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: radial-gradient(circle, rgba(120, 200, 255, 1), rgba(120, 200, 255, 0.3));
      border-radius: 50%;
      filter: blur(1px);
      box-shadow: 0 0 15px rgba(120, 200, 255, 1);
      pointer-events: none;
      z-index: 2;
      animation: particle-float 15s linear infinite;
    }

    @keyframes particle-float {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) translateX(100px);
        opacity: 0;
      }
    }

    .light-particle:nth-child(1) {
      left: 10%;
      animation-delay: 0s;
      animation-duration: 16s;
      background: radial-gradient(circle, #6bc8ff, rgba(107, 200, 255, 0.3));
      box-shadow: 0 0 15px #6bc8ff;
    }

    .light-particle:nth-child(2) {
      left: 30%;
      animation-delay: -5s;
      animation-duration: 12s;
      background: radial-gradient(circle, #00ffff, rgba(0, 255, 255, 0.3));
      box-shadow: 0 0 15px #00ffff;
    }

    .light-particle:nth-child(3) {
      left: 60%;
      animation-delay: -8s;
      animation-duration: 18s;
      background: radial-gradient(circle, #64c8ff, rgba(100, 200, 255, 0.3));
      box-shadow: 0 0 15px #64c8ff;
    }

    .light-particle:nth-child(4) {
      left: 80%;
      animation-delay: -3s;
      animation-duration: 14s;
      background: radial-gradient(circle, #00ff88, rgba(0, 255, 136, 0.3));
      box-shadow: 0 0 15px #00ff88;
    }

    /* Image gallery glow effects */
    @keyframes image-glow {
      0%, 100% { filter: brightness(1) drop-shadow(0 0 15px rgba(100, 200, 255, 0.3)); }
      50% { filter: brightness(1.1) drop-shadow(0 0 25px rgba(0, 255, 255, 0.5)); }
    }

    iframe {
      animation: image-glow 4s ease-in-out infinite;
    }

    p {
      transition: all 0.3s ease;
    }
  </style>
</head>
